name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e

            # Color output
            RED='\033[0;31m'
            GREEN='\033[0;32m'
            YELLOW='\033[1;33m'
            NC='\033[0m' # No Color

            PROJECT_DIR="/home/ubuntu/Monitor"
            SERVICE_NAME="qq-forward-bot"
            BACKUP_DIR="$PROJECT_DIR/.deploy_backup"

            echo -e "${GREEN}=== 部署开始 ===${NC}"
            echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"
            echo "提交: ${{ github.sha }}"
            echo "分支: ${{ github.ref_name }}"

            # 1. 进入项目目录
            echo -e "\n${GREEN}[1/10] 进入项目目录${NC}"
            cd "$PROJECT_DIR" || { echo -e "${RED}✗ 项目目录不存在${NC}"; exit 1; }

            # 2. 备份当前版本
            echo -e "\n${GREEN}[2/10] 备份当前版本${NC}"
            mkdir -p "$BACKUP_DIR"
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "$CURRENT_COMMIT" > "$BACKUP_DIR/last_commit.txt"
            echo "备份提交: $CURRENT_COMMIT"

            # 3. 拉取最新代码
            echo -e "\n${GREEN}[3/10] 拉取最新代码${NC}"
            git fetch origin main
            git reset --hard origin/main
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "新提交: $NEW_COMMIT"

            # 4. 检查是否有更新
            if [ "$CURRENT_COMMIT" = "$NEW_COMMIT" ]; then
              echo -e "${YELLOW}⚠ 代码无变化，跳过部署${NC}"
              exit 0
            fi

            # 5. 显示变更
            echo -e "\n${GREEN}[4/10] 代码变更${NC}"
            git log --oneline --no-decorate "$CURRENT_COMMIT..$NEW_COMMIT" | head -5

            # 6. 安装中文字体（仅首次）
            echo -e "\n${GREEN}[5/10] 检查中文字体${NC}"
            if ! fc-list | grep -q "WenQuanYi"; then
              echo "安装中文字体..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq fonts-wqy-microhei
            else
              echo "✓ 字体已安装"
            fi

            # 7. 安装/更新依赖
            echo -e "\n${GREEN}[6/10] 更新依赖${NC}"
            if [ -f requirements.txt ]; then
              "$PROJECT_DIR/.venv/bin/pip" install -r requirements.txt -q --no-cache-dir
              echo "✓ 依赖已更新"
            else
              echo -e "${YELLOW}⚠ requirements.txt 不存在${NC}"
            fi

            # 8. 语法检查
            echo -e "\n${GREEN}[7/10] 语法检查${NC}"
            if "$PROJECT_DIR/.venv/bin/python" -m py_compile bot.py plugins/*.py 2>/dev/null; then
              echo "✓ 语法检查通过"
            else
              echo -e "${RED}✗ 语法错误，回滚部署${NC}"
              git reset --hard "$CURRENT_COMMIT"
              exit 1
            fi

            # 9. 检查配置文件
            echo -e "\n${GREEN}[8/10] 检查配置${NC}"
            if [ ! -f .env ]; then
              echo -e "${RED}✗ .env 文件不存在${NC}"
              if [ -f .env.example ]; then
                cp .env.example .env
                echo -e "${YELLOW}⚠ 已从 .env.example 复制，请手动配置${NC}"
              fi
              exit 1
            else
              echo "✓ .env 存在"
            fi

            # 10. 重启服务
            echo -e "\n${GREEN}[9/10] 重启服务${NC}"
            sudo systemctl daemon-reload
            sudo systemctl restart "$SERVICE_NAME"

            # 11. 健康检查
            echo -e "\n${GREEN}[10/10] 健康检查${NC}"
            sleep 5

            # 检查服务状态
            if sudo systemctl is-active "$SERVICE_NAME" --quiet; then
              echo -e "${GREEN}✓ 服务运行中${NC}"

              # 检查日志中是否有错误
              if sudo journalctl -u "$SERVICE_NAME" -n 50 --no-pager | grep -i "error\|exception\|failed" | grep -v "ERROR.*WebSocket.*关闭" > /dev/null; then
                echo -e "${YELLOW}⚠ 发现错误日志，请检查${NC}"
                sudo journalctl -u "$SERVICE_NAME" -n 20 --no-pager
              else
                echo -e "${GREEN}✓ 无错误日志${NC}"
              fi

              # 显示最近日志
              echo -e "\n${GREEN}最近日志:${NC}"
              sudo journalctl -u "$SERVICE_NAME" -n 10 --no-pager --output=short

              echo -e "\n${GREEN}=== 部署成功 ===${NC}"
              echo "版本: $CURRENT_COMMIT -> $NEW_COMMIT"

            else
              echo -e "${RED}✗ 服务启动失败，回滚部署${NC}"

              # 显示错误日志
              echo -e "\n${RED}错误日志:${NC}"
              sudo journalctl -u "$SERVICE_NAME" -n 30 --no-pager

              # 回滚
              echo -e "\n${YELLOW}回滚到上一版本...${NC}"
              git reset --hard "$CURRENT_COMMIT"
              sudo systemctl restart "$SERVICE_NAME"
              sleep 3

              if sudo systemctl is-active "$SERVICE_NAME" --quiet; then
                echo -e "${GREEN}✓ 回滚成功${NC}"
              else
                echo -e "${RED}✗ 回滚失败，需要手动介入${NC}"
              fi

              exit 1
            fi

      - name: Deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 部署成功"
          else
            echo "❌ 部署失败"
          fi
