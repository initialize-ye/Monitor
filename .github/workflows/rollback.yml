name: Rollback

on:
  workflow_dispatch:
    inputs:
      commit:
        description: '回滚到的提交 SHA（留空回滚到上一次部署）'
        required: false
        type: string

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            RED='\033[0;31m'
            GREEN='\033[0;32m'
            YELLOW='\033[1;33m'
            NC='\033[0m'

            PROJECT_DIR="/home/ubuntu/Monitor"
            SERVICE_NAME="qq-forward-bot"
            BACKUP_DIR="$PROJECT_DIR/.deploy_backup"

            echo -e "${YELLOW}=== 开始回滚 ===${NC}"
            echo "时间: $(date '+%Y-%m-%d %H:%M:%S')"

            cd "$PROJECT_DIR" || exit 1

            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "当前提交: $CURRENT_COMMIT"

            # 确定回滚目标
            if [ -n "${{ inputs.commit }}" ]; then
              TARGET_COMMIT="${{ inputs.commit }}"
              echo "回滚到指定提交: $TARGET_COMMIT"
            elif [ -f "$BACKUP_DIR/last_commit.txt" ]; then
              TARGET_COMMIT=$(cat "$BACKUP_DIR/last_commit.txt")
              echo "回滚到上次部署: $TARGET_COMMIT"
            else
              echo -e "${RED}✗ 无法确定回滚目标${NC}"
              exit 1
            fi

            # 验证提交存在
            if ! git cat-file -e "$TARGET_COMMIT" 2>/dev/null; then
              echo -e "${RED}✗ 提交 $TARGET_COMMIT 不存在${NC}"
              exit 1
            fi

            # 显示变更
            echo -e "\n${YELLOW}回滚变更:${NC}"
            git log --oneline --no-decorate "$TARGET_COMMIT..$CURRENT_COMMIT" | head -10

            # 执行回滚
            echo -e "\n${YELLOW}执行回滚...${NC}"
            git reset --hard "$TARGET_COMMIT"

            # 重启服务
            echo -e "\n${YELLOW}重启服务...${NC}"
            sudo systemctl restart "$SERVICE_NAME"
            sleep 5

            # 检查服务状态
            if sudo systemctl is-active "$SERVICE_NAME" --quiet; then
              echo -e "${GREEN}✓ 回滚成功${NC}"
              echo "版本: $CURRENT_COMMIT -> $TARGET_COMMIT"

              echo -e "\n${GREEN}最近日志:${NC}"
              sudo journalctl -u "$SERVICE_NAME" -n 10 --no-pager
            else
              echo -e "${RED}✗ 回滚后服务启动失败${NC}"
              sudo journalctl -u "$SERVICE_NAME" -n 30 --no-pager
              exit 1
            fi

      - name: Rollback result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ 回滚成功"
          else
            echo "❌ 回滚失败"
          fi
